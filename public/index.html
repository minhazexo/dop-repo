<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Department of Physics at Government Bangla College offering B.Sc. and M.Sc. programs with modern facilities and research opportunities."
    />
    <meta property="og:title" content="Department of Physics - Government Bangla College">
    <meta property="og:description" content="Excellence in physics education since 2010">
    <meta property="og:image" content="https://yourdomain.com/images/hero-og.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Department of Physics - Government Bangla College">
    <link rel="canonical" href="https://yourdomain.com/">
    <link rel="preload" as="image" href="/images/5.jpg">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Department of Physics - Government Bangla College</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Department of Physics, Government Bangla College",
      "url": "https://yourdomain.com",
      "logo": "https://yourdomain.com/images/gbclogo.png",
      "foundingLocation": {
        "@type": "City",
        "name": "Your City"
      },
      "foundingDate": "2010",
      "hasCourse": [
        {
          "@type": "Course",
          "name": "B.Sc. (Honors) in Physics",
          "courseCode": "BSC-PHYS",
          "description": "Undergraduate program following National University curriculum"
        },
        {
          "@type": "Course",
          "name": "M.Sc. in Physics",
          "courseCode": "MSC-PHYS",
          "description": "Postgraduate program with research components"
        }
      ],
      "faculty": [
        {
          "@type": "Person",
          "name": "Professor Taslima Ferdous",
          "jobTitle": "Department Head"
        }
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
